spring.application.name=sensor-monitoring
server.port=8080
spring.datasource.url=jdbc:sqlite:./data/sensor-monitoring.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
sensor.api-key=${SENSOR_API_KEY:dev-sensor-key-change-me}
